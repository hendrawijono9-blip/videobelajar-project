<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Akun - videobelajar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
        
            <div class="card-header-text">
                <h2>Masuk ke Akun</h2>
                <p>Yuk, lanjutin belajarmu di videobelajar.</p>
            </div>

            <form>
                <div class="form-group">
                    <label for="email">E-Mail <span class="required">*</span></label>
                    <input type="email" id="email" placeholder="">
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="">
                        <span class="eye-icon">
                            <i class="fa-regular fa-eye-slash"></i>
                        </span>
                    </div>
                </div>
                <div class="forgot-password">
                    <a href="#">Lupa Password?</a>
                </div>
                <button type="submit" class="btn btn-masuk">Masuk</button>

                <a href="#" class="btn btn-daftar">Daftar</a>
                <div class="divider">
                    <span>atau</span>
                </div>
                <button type="button" class="btn btn-google">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo" width="20">
                    Masuk dengan Google
                </button>
            </form>

        </div>
    </div>

</body>
</html>
